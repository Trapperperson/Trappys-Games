<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trapper Guy's Games!</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Arial, sans-serif;
        background-color: #121212;
        color: #ffffff;
        padding-top: 80px;
      }
      .header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 60px;
        background-color: #1f1f1f;
        border-bottom: 2px solid #333333;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .header h1 {
        font-size: 24px;
        color: #ffffff;
        letter-spacing: 1px;
      }
      .container {
        max-width: 1000px;
        margin: 20px auto;
        padding: 0 16px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
      }
      .game-card {
        background-color: #1e1e1e;
        border: 1px solid #333;
        border-radius: 8px;
        overflow: hidden;
        cursor: pointer;
        color: white;
        transition: transform 0.2s, border-color 0.2s;
        display: flex;
        flex-direction: column;
      }
      .game-card:hover {
        transform: translateY(-5px);
        border-color: #4cbf56;
      }
      .grid-thumbnail {
        width: 100%;
        height: 140px;
        object-fit: cover;
        background-color: #000;
      }
      .card-info {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .card-title {
        font-size: 16px;
        font-weight: bold;
      }
      .card-date {
        font-size: 12px;
        color: #aaaaaa;
      }
      .modal-backdrop {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.85);
        z-index: 2000;
        justify-content: center;
        align-items: center;
        padding: 20px;
        backdrop-filter: blur(4px);
      }
      .modal-backdrop.active {
        display: flex;
      }
      .modal-card {
        background-color: #18181b;
        border: 2px solid #333;
        border-radius: 12px;
        padding: 36px;
        width: 100%;
        max-width: 950px;
        min-height: 520px;
        position: relative;
        display: grid;
        grid-template-columns: 1.1fr 1.3fr;
        gap: 32px;
        box-shadow: 0 12px 32px rgba(0,0,0,0.8);
        animation: popIn 0.2s ease-out;
      }
      @keyframes popIn {
        from { transform: scale(0.95); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      @media (max-width: 768px) {
        .modal-card {
          grid-template-columns: 1fr;
          max-height: 90vh;
          overflow-y: auto;
          min-height: auto;
          padding: 24px;
        }
      }
      .close-btn {
        position: absolute;
        top: 14px;
        right: 18px;
        background: none;
        border: none;
        color: #aaa;
        font-size: 32px;
        font-weight: bold;
        cursor: pointer;
        transition: color 0.2s;
      }
      .close-btn:hover {
        color: #ffffff;
      }
      .popup-left {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .popup-thumbnail {
        width: 100%;
        height: 240px;
        object-fit: contain;
        border-radius: 8px;
        background-color: #0d0d0f;
        border: 1px solid #333;
      }
      .popup-title {
        font-size: 22px;
        font-weight: bold;
      }
      .popup-meta {
        font-size: 14px;
        color: #aaaaaa;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .device-icons {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .device-icons svg {
        width: 22px;
        height: 22px;
        fill: #ffffff;
        opacity: 0.9;
      }
      .play-btn {
        background-color: #2ecc71;
        color: white;
        text-decoration: none;
        text-align: center;
        padding: 16px;
        border-radius: 8px;
        font-size: 22px;
        font-weight: bold;
