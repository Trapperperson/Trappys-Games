<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trapper Guy's Games!</title>
    <style>
      *{
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body{
        font-family: Arial, sans-serif;
        background-color: #121212;
        color: #ffffff;
        padding-top: 80px;
      }
      .header{
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 60px;
        background-color: #1f1f1f;
        border-bottom: 2px solid #333333;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .header h1{
        font-size: 24px;
        color: #ffffff;
        letter-spacing: 1px;
      }
      .container{
        max-width: 1000px;
        margin: 20px auto;
        padding: 0 16px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
      .game-card{
        background-color: #1e1e1e;
        border: 1px solid #333;
        border-radius: 8px;
        overflow: hidden;
        text-decoration: none;
        color: white;
        transition: transform 0.2s, border-color 0.2s;
        display: flex;
        flex-direction: column;
      }
      .game-card:hover{
        transform: translateY(-5px);
        border-color: #4cbf56;
      }
      .thumbnail{
        width: 100%;
        height: 140px;
        object-fit: cover;
        background-color: #000;
      }
      .card-info{
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .game-title{
        font-size: 18px;
        font-weight: bold;
      }
      .game-date{
        font-size: 12px;
        color: #aaaaaa;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <h1>Trapper Guy's Games!</h1>
    </header>
    <main class="container" id="game-list"></main>
    <script>
      // ADD GAMES HERE.
      const myGames = [
        {
          title: "The Swap Possible Game",
          date: "2026-05-10",
          link: "https://trapperperson.github.io/The-Swap-Possible-Game/",
          thumbnail: "https://via.placeholder.com/300x180/000000/FFFFFF?text=Swap+Possible",
        },
      ];

      const container = document.getElementById('game-list');
      myGames.forEach(game => {
        const card = document.createElement('a');
        card.className = 'game-card';
        card.href = game.link;
        card.target = '_blank';

        card.innerHTML = `
          <img class="thumbnail" src="${game.thumbnail}" alt="${game.title} Thumbnail">
          <div class="card-info">
            <div class="game-title">${game.title}</div>
            <div class="game-date">Released: ${game.date}</div>
          </div>
        `;

        container.appendChild(card);
      });
    </script>
  </body>
</html>
