<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trapper Guy's Games!</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Arial, sans-serif;
        background-color: #121212;
        color: #ffffff;
        padding-top: 90px;
        padding-bottom: 60px;
      }
      .header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 75px;
        background-color: #1f1f1f;
        border-bottom: 2px solid #333333;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: 0 16px;
      }
      .header-logo {
        height: 50px;
        object-fit: contain;
      }
      .container {
        max-width: 1000px;
        margin: 20px auto;
        padding: 0 16px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
      }
      .game-card {
        background-color: #1e1e1e;
        border: 1px solid #333;
        border-radius: 8px;
        overflow: hidden;
        cursor: pointer;
        color: white;
        transition: transform 0.2s, border-color 0.2s;
        display: flex;
        flex-direction: column;
      }
      .game-card:hover {
        transform: translateY(-5px);
        border-color: #4cbf56;
      }
      .grid-thumbnail {
        width: 100%;
        height: 140px;
        object-fit: cover;
        background-color: #000;
      }
      .card-info {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .card-title {
        font-size: 16px;
        font-weight: bold;
      }
      .card-date {
        font-size: 12px;
        color: #aaaaaa;
      }
      .modal-backdrop {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.85);
        z-index: 2000;
        justify-content: center;
        align-items: center;
        padding: 20px;
        backdrop-filter: blur(4px);
      }
      .modal-backdrop.active {
        display: flex;
      }
      .modal-card {
        background-color: #18181b;
        border: 2px solid #333;
        border-radius: 12px;
        padding: 36px;
        width: 100%;
        max-width: 950px;
        min-height: 520px;
        position: relative;
        display: grid;
        grid-template-columns: 1.1fr 1.3fr;
        gap: 32px;
        box-shadow: 0 12px 32px rgba(0,0,0,0.8);
        animation: popIn 0.2s ease-out;
      }
      @keyframes popIn {
        from { transform: scale(0.95); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      @media (max-width: 768px) {
        .modal-card {
          grid-template-columns: 1fr;
          max-height: 90vh;
          overflow-y: auto;
          min-height: auto;
          padding: 24px;
        }
      }
      .close-btn {
        position: absolute;
        top: 14px;
        right: 18px;
        background: none;
        border: none;
        color: #aaa;
        font-size: 32px;
        font-weight: bold;
        cursor: pointer;
        transition: color 0.2s;
      }
      .close-btn:hover {
        color: #ffffff;
      }
      .popup-left {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .popup-thumbnail {
        width: 100%;
        height: 240px;
        object-fit: contain;
        border-radius: 8px;
        background-color: #0d0d0f;
        border: 1px solid #333;
      }
      .popup-title {
        font-size: 22px;
        font-weight: bold;
      }
      .popup-meta {
        font-size: 14px;
        color: #aaaaaa;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .device-icons {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .device-icons svg {
        width: 22px;
        height: 22px;
        fill: #ffffff;
        opacity: 0.9;
      }
      .play-btn {
        background-color: #2ecc71;
        color: white;
        text-decoration: none;
        text-align: center;
        padding: 16px;
        border-radius: 8px;
        font-size: 22px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: background-color 0.2s, transform 0.1s;
        box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
        margin-top: auto;
      }
      .play-btn:hover {
        background-color: #27ae60;
        transform: translateY(-2px);
      }
      .popup-right {
        background-color: #121214;
        border: 1px solid #2a2a2e;
        border-radius: 8px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .desc-header {
        font-size: 18px;
        font-weight: bold;
        color: #ffffff;
      }
      .desc-text {
        font-size: 14px;
        color: #cccccc;
        line-height: 1.6;
        white-space: pre-line;
      }
      .desc-text a {
        color: #3498db;
        text-decoration: none;
        word-break: break-all;
      }
      .desc-text a:hover {
        text-decoration: underline;
      }

      .player {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 3000;
        background-color: #0b0b0d;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        flex-direction: column;
      }
      .player.active { display: flex; }
      .player-bar {
        height: 56px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 16px;
        background-color: #1f1f1f;
        border-bottom: 2px solid #333;
      }
      .player-title {
        flex: 1;
        font-weight: bold;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .player-vol { display: flex; align-items: center; gap: 8px; }
      .player-vol input { width: 110px; accent-color: #2ecc71; cursor: pointer; }
      .player-btn {
        background-color: #2a2a2e;
        color: #fff;
        border: 1px solid #3a3a40;
        border-radius: 6px;
        padding: 7px 12px;
        font-size: 14px;
        cursor: pointer;
        transition: border-color 0.2s;
      }
      .player-btn:hover { border-color: #4cbf56; }
      .player-stage {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      #playerFrame {
        width: min(100%, calc((100vh - 130px) * 4 / 3));
        aspect-ratio: 4 / 3;
        border: 0;
        background: #000;
        border-radius: 4px;
        box-shadow: 0 0 0 5px #0b0b0d,
                    0 0 0 7px rgba(255, 255, 255, 0.35),
                    0 14px 44px rgba(0, 0, 0, 0.85);
      }
      #playerFrame:fullscreen {
        width: 100%;
        height: 100%;
        aspect-ratio: auto;
        border-radius: 0;
        box-shadow: none;
      }
      @media (max-width: 600px) {
        .player-stage { padding: 14px; }
        .player-vol input { width: 70px; }
        .player-title { display: none; }
        .player-vol { margin-right: auto; }
      }

      .trapper-widget {
        position: fixed;
        bottom: 10px;
        right: 10px;
        z-index: 1500;
        cursor: pointer;
        width: 170px;
        height: 170px;
        animation: slideUp 0.5s ease-out;
      }
      @keyframes slideUp {
        from { transform: translateY(100px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .trapper-img {
        position: absolute;
        bottom: 0;
        right: 0;
        object-fit: contain;
        filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
        transition: opacity 0.2s ease-in-out;
      }
      #trapperImg1 {
        width: 110px;
        height: 110px;
        opacity: 1;
      }
      #trapperImg2 {
        width: 170px;
        height: 170px;
        opacity: 0;
      }
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      .trapper-widget:hover #trapperImg1 {
        opacity: 0;
      }
      .trapper-widget:hover #trapperImg2 {
        opacity: 1;
        animation: bounce 0.5s infinite ease-in-out;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <img src="images/Trappy's Games.png" alt="Trappy's Games Logo" class="header-logo">
    </header>

    <main class="container" id="game-list"></main>

    <div class="player" id="player">
      <div class="player-bar">
        <div class="player-title" id="playerTitle"></div>
        <div class="player-vol">
          <button class="player-btn" id="muteBtn" type="button" title="Mute">🔊</button>
          <input type="range" id="volSlider" min="0" max="100" value="100" title="Volume">
        </div>
        <button class="player-btn" id="pauseBtn" type="button">⏸ Pause</button>
        <button class="player-btn" id="fsBtn" type="button">⛶ Fullscreen</button>
        <button class="player-btn" id="exitBtn" type="button">✕ Close</button>
      </div>
      <div class="player-stage">
        <iframe id="playerFrame" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
      </div>
    </div>

    <div class="trapper-widget" id="trapperWidget" title="Click to check out my YouTube channel!">
      <img src="images/trap1.png" alt="Trapper Mascot" class="trapper-img" id="trapperImg1">
      <img src="images/trap2.png" alt="Trapper Mascot Talking" class="trapper-img" id="trapperImg2">
    </div>

    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal-card">
        <button class="close-btn" id="closeModal">&times;</button>
        <div class="popup-left">
          <img class="popup-thumbnail" id="modalThumb" src="" alt="Thumbnail">
          <div class="popup-title" id="modalTitle"></div>
          <div class="popup-meta">
            <span id="modalMeta"></span>
            <div class="device-icons" id="modalIcons"></div>
          </div>
          <a class="play-btn" id="modalPlay" href="#">
            ▶ PLAY
          </a>
        </div>
        <div class="popup-right">
          <div class="desc-header">Description:</div>
          <div class="desc-text" id="modalDesc"></div>
        </div>
      </div>
    </div>

    <script>
      // ADD YOUR GAMES HERE
      const myGames = [
        {
          id: "swap-possible",
          title: "The Swap! Possible Game",
          version: "1.0.8",
          date: "2026-05-10",
          play: "games/TheSwapPossibleGame/index.html",
          mobilePlay: "games/TheSwapPossibleGame/mobile/index.html",
          thumbnail: "images/tspgthumbnail.png",
          background: "images/bggames/swap-possible-bg.webp",
          description: `The Swap! Possible Game is a Swapped version of The Impossible Game, it introduces a brand new level "Stable Reality", it has everything and even a little surprise once you beat it!

All sprites were made by Trapper Guy and some took from The Impossible Game's sprites, and it was made on Scratch's Engine and Packaged inside TurboWarp's Packager.

Keybinds:
Up Arrow/ Space Bar / Left Click, to Jump.
P Key to Go back to the menu (Saves your attempts).

Link to original: <a href="https://youtu.be/T8vSogP9ipw?si=amaUgHXITfyfUzBT" target="_blank">https://youtu.be/T8vSogP9ipw?si=amaUgHXITfyfUzBT</a>`,
          mobile: true,
          pc: true
        }
      ];

      let currentGame = null;
      const container = document.getElementById('game-list');
      const backdrop = document.getElementById('modalBackdrop');
      const closeBtn = document.getElementById('closeModal');

      const mobileIconSVG = `<svg viewBox="0 0 24 24"><path d="M17 1H7C5.9 1 5 1.9 5 3v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-2-2-2zm0 18H7V5h10v14zM7 3h10v1H7V3z"/></svg>`;
      const pcIconSVG = `<svg viewBox="0 0 24 24"><path d="M21 2H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h7v2H8v2h8v-2h-2v-2h7c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H3V4h18v12z"/></svg>`;

      myGames.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
          <img class="grid-thumbnail" src="${game.thumbnail}" alt="${game.title}">
          <div class="card-info">
            <div class="card-title">${game.title}</div>
            <div class="card-date">Released: ${game.date}</div>
          </div>
        `;

        card.addEventListener('click', () => openModal(game));
        container.appendChild(card);
      });

      function openModal(game) {
        document.getElementById('modalThumb').src = game.thumbnail;
        document.getElementById('modalTitle').textContent = game.title;
        document.getElementById('modalMeta').textContent = `Released: ${game.date} | Version: ${game.version}`;
        document.getElementById('modalDesc').innerHTML = game.description;
        currentGame = game;

        const iconsContainer = document.getElementById('modalIcons');
        iconsContainer.innerHTML = '';
        if (game.mobile) iconsContainer.innerHTML += mobileIconSVG;
        if (game.pc) iconsContainer.innerHTML += pcIconSVG;

        backdrop.classList.add('active');
      }

      closeBtn.addEventListener('click', () => backdrop.classList.remove('active'));
      backdrop.addEventListener('click', (e) => {
        if (e.target === backdrop) backdrop.classList.remove('active');
      });

      const player = document.getElementById('player');
      const frame = document.getElementById('playerFrame');
      const volSlider = document.getElementById('volSlider');
      const muteBtn = document.getElementById('muteBtn');
      const fsBtn = document.getElementById('fsBtn');
      let muted = false;

      function applyVolume() {
        try {
          const engine = frame.contentWindow.Scratch.audioEngine;
          engine.inputNode.gain.value = muted ? 0 : volSlider.value / 100;
        } catch (e) { /* game not ready yet, or not same-origin */ }
      }
      function updateMuteIcon() {
        muteBtn.textContent = (muted || volSlider.value == 0) ? '🔇' : '🔊';
      }

      function isMobileDevice() {
        if (navigator.userAgentData && navigator.userAgentData.mobile) return true;
        if (/Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent)) return true;
        return navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1; // iPads
      }
      function pickVersion(game) {
        if (isMobileDevice()) return game.mobilePlay || game.play;
        return game.play || game.mobilePlay;
      }

      document.getElementById('modalPlay').addEventListener('click', (e) => {
        e.preventDefault();
        if (!currentGame) return;
        document.getElementById('playerTitle').textContent = currentGame.title;
        paused = false;
        pauseBtn.textContent = '⏸ Pause';
        const bg = (isMobileDevice() && currentGame.mobileBackground) || currentGame.background;
        player.style.backgroundImage = bg
          ? `linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url("${bg}")`
          : '';
        frame.src = pickVersion(currentGame);
        backdrop.classList.remove('active');
        player.classList.add('active');
        document.body.style.overflow = 'hidden';
        let tries = 0;
        const timer = setInterval(() => { applyVolume(); if (++tries > 20) clearInterval(timer); }, 250);
        frame.onload = () => { applyVolume(); frame.focus(); };
      });

      const pauseBtn = document.getElementById('pauseBtn');
      let paused = false;
      function pauseClock(w) {
        if (w.__pauseClock) return w.__pauseClock;
        const RealDate = w.Date;
        const realNow = RealDate.now.bind(RealDate);
        const st = { offset: 0, pausedAt: 0, realNow };
        class ShiftedDate extends RealDate {
          constructor(...args) {
            if (args.length === 0) super(realNow() - st.offset);
            else super(...args);
          }
          static now() { return realNow() - st.offset; }
        }
        w.Date = ShiftedDate;
        w.__pauseClock = st;
        return st;
      }

      function setPaused(p) {
        try {
          const w = frame.contentWindow;
          const rt = w.vm.runtime;
          const st = pauseClock(w);
          if (p) {
            st.pausedAt = st.realNow();
            rt.ioDevices.clock.pause();
            rt.stop();
            rt.audioEngine.audioContext.suspend();
          } else {
            st.offset += st.realNow() - st.pausedAt;
            rt.ioDevices.clock.resume();
            rt.start();
            rt.audioEngine.audioContext.resume();
          }
          paused = p;
          pauseBtn.textContent = p ? '▶ Resume' : '⏸ Pause';
        } catch (e) { /* game not loaded yet */ }
      }
      pauseBtn.addEventListener('click', () => { setPaused(!paused); if (!paused) frame.focus(); });

      volSlider.addEventListener('input', () => { muted = false; updateMuteIcon(); applyVolume(); });
      muteBtn.addEventListener('click', () => { muted = !muted; updateMuteIcon(); applyVolume(); });

      if (frame.requestFullscreen || frame.webkitRequestFullscreen) {
        fsBtn.addEventListener('click', () => {
          (frame.requestFullscreen || frame.webkitRequestFullscreen).call(frame);
          frame.focus();
        });
      } else {
        fsBtn.style.display = 'none';
      }

      document.getElementById('exitBtn').addEventListener('click', () => {
        player.classList.remove('active');
        frame.src = 'about:blank';
        paused = false;
        pauseBtn.textContent = '⏸ Pause';
        document.body.style.overflow = '';
      });

      const trapperWidget = document.getElementById('trapperWidget');
      const ytChannelUrl = 'https://youtube.com/@trapper_guy_channel?si=hz8I4zq7Vjji0IeN';
      
      trapperWidget.addEventListener('click', () => {
        window.open(ytChannelUrl, '_blank');
      });
    </script>
  </body>
</html>
