<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trapper Guy's Games!</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Arial, sans-serif;
        background-color: #121212;
        color: #ffffff;
        padding-top: 90px;
        padding-bottom: 60px;
      }
      .header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 75px;
        background-color: #1f1f1f;
        border-bottom: 2px solid #333333;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: 0 16px;
      }
      .header-logo {
        height: 50px;
        object-fit: contain;
      }
      .container {
        max-width: 1000px;
        margin: 20px auto;
        padding: 0 16px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
      }
      .game-card {
        background-color: #1e1e1e;
        border: 1px solid #333;
        border-radius: 8px;
        overflow: hidden;
        cursor: pointer;
        color: white;
        transition: transform 0.2s, border-color 0.2s;
        display: flex;
        flex-direction: column;
      }
      .game-card:hover {
        transform: translateY(-5px);
        border-color: #4cbf56;
      }
      .grid-thumbnail {
        width: 100%;
        height: 140px;
        object-fit: cover;
        background-color: #000;
      }
      .card-info {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .card-title {
        font-size: 16px;
        font-weight: bold;
      }
      .card-date {
        font-size: 12px;
        color: #aaaaaa;
      }
      .modal-backdrop {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.85);
        z-index: 2000;
        justify-content: center;
        align-items: center;
        padding: 20px;
        backdrop-filter: blur(4px);
      }
      .modal-backdrop.active {
        display: flex;
      }
      .modal-card {
        background-color: #18181b;
        border: 2px solid #333;
        border-radius: 12px;
        padding: 36px;
        width: 100%;
        max-width: 950px;
        min-height: 520px;
        position: relative;
        display: grid;
        grid-template-columns: 1.1fr 1.3fr;
        gap: 32px;
        box-shadow: 0 12px 32px rgba(0,0,0,0.8);
        animation: popIn 0.2s ease-out;
      }
      @keyframes popIn {
        from { transform: scale(0.95); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      @media (max-width: 768px) {
        .modal-card {
          grid-template-columns: 1fr;
          max-height: 90vh;
          overflow-y: auto;
          min-height: auto;
          padding: 24px;
        }
      }
      .close-btn {
        position: absolute;
        top: 14px;
        right: 18px;
        background: none;
        border: none;
        color: #aaa;
        font-size: 32px;
        font-weight: bold;
        cursor: pointer;
        transition: color 0.2s;
      }
      .close-btn:hover {
        color: #ffffff;
      }
      .popup-left {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .popup-thumbnail {
        width: 100%;
        height: 240px;
        object-fit: contain;
        border-radius: 8px;
        background-color: #0d0d0f;
        border: 1px solid #333;
      }
      .popup-title {
        font-size: 22px;
        font-weight: bold;
      }
      .popup-meta {
        font-size: 14px;
        color: #aaaaaa;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .device-icons {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .device-icons svg {
        width: 22px;
        height: 22px;
        fill: #ffffff;
        opacity: 0.9;
      }
      .play-btn {
        background-color: #2ecc71;
        color: white;
        text-decoration: none;
        text-align: center;
        padding: 16px;
        border-radius: 8px;
        font-size: 22px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: background-color 0.2s, transform 0.1s;
        box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
        margin-top: auto;
      }
      .play-btn:hover {
        background-color: #27ae60;
        transform: translateY(-2px);
      }
      .popup-right {
        background-color: #121214;
        border: 1px solid #2a2a2e;
        border-radius: 8px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .desc-header {
        font-size: 18px;
        font-weight: bold;
        color: #ffffff;
      }
      .desc-text {
        font-size: 14px;
        color: #cccccc;
        line-height: 1.6;
        white-space: pre-line;
      }
      .desc-text a {
        color: #3498db;
        text-decoration: none;
        word-break: break-all;
      }
      .desc-text a:hover {
        text-decoration: underline;
      }

      /* Perfect Sizing & Positioning for Trapper Mascot Widget */
      .trapper-widget {
        position: fixed;
        bottom: 10px;
        right: 10px;
        z-index: 1500;
        cursor: pointer;
        width: 170px;
        height: 170px;
        animation: slideUp 0.5s ease-out;
      }
      @keyframes slideUp {
        from { transform: translateY(100px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .trapper-img {
        position: absolute;
        bottom: 0;
        right: 0;
        object-fit: contain;
        filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
        transition: opacity 0.2s ease-in-out;
      }
      /* trap1 styling (default state) */
      #trapperImg1 {
        width: 110px;
        height: 110px;
        opacity: 1;
      }
      /* trap2 styling (wider to accommodate speech bubble without squishing) */
      #trapperImg2 {
        width: 170px;
        height: 170px;
        opacity: 0;
      }
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      /* Hover states: swap visibility and bounce */
      .trapper-widget:hover #trapperImg1 {
        opacity: 0;
      }
      .trapper-widget:hover #trapperImg2 {
        opacity: 1;
        animation: bounce 0.5s infinite ease-in-out;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <img src="images/Trappy's Games.png" alt="Trappy's Games Logo" class="header-logo">
    </header>

    <main class="container" id="game-list"></main>

    <!-- Interactive Hover-Swap Trapper Mascot Widget -->
    <div class="trapper-widget" id="trapperWidget" title="Click to check out my YouTube channel!">
      <img src="images/trap1.png" alt="Trapper Mascot" class="trapper-img" id="trapperImg1">
      <img src="images/trap2.png" alt="Trapper Mascot Talking" class="trapper-img" id="trapperImg2">
    </div>

    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal-card">
        <button class="close-btn" id="closeModal">&times;</button>
        <div class="popup-left">
          <img class="popup-thumbnail" id="modalThumb" src="" alt="Thumbnail">
          <div class="popup-title" id="modalTitle"></div>
          <div class="popup-meta">
            <span id="modalMeta"></span>
            <div class="device-icons" id="modalIcons"></div>
          </div>
          <a class="play-btn" id="modalPlay" href="#" target="_blank">
            ▶ PLAY
          </a>
        </div>
        <div class="popup-right">
          <div class="desc-header">Description:</div>
          <div class="desc-text" id="modalDesc"></div>
        </div>
      </div>
    </div>

    <script>
      // ADD YOUR GAMES HERE
      const myGames = [
        {
          id: "swap-possible",
          title: "The Swap! Possible Game",
          version: "1.0.6",
          date: "2026-05-10",
          link: "https://trapperperson.github.io/The-Swap-Possible-Game/",
          thumbnail: "images/tspgthumbnail.png",
          description: `The Swap! Possible Game is a Swapped version of The Impossible Game, it introduces a brand new level "Stable Reality", it has everything and even a little surprise once you beat it!

All sprites were made by Trapper Guy and some took from The Impossible Game's sprites, and it was made on Scratch's Engine and Packaged inside TurboWarp's Packager.

Keybinds:
Up Arrow/ Space Bar / Left Click, to Jump.
P Key to Go back to the menu (Saves your attempts).

Link to original: <a href="https://youtu.be/T8vSogP9ipw?si=amaUgHXITfyfUzBT" target="_blank">https://youtu.be/T8vSogP9ipw?si=amaUgHXITfyfUzBT</a>`,
          mobile: true,
          pc: true
        }
      ];

      const container = document.getElementById('game-list');
      const backdrop = document.getElementById('modalBackdrop');
      const closeBtn = document.getElementById('closeModal');

      const mobileIconSVG = `<svg viewBox="0 0 24 24"><path d="M17 1H7C5.9 1 5 1.9 5 3v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-2-2-2zm0 18H7V5h10v14zM7 3h10v1H7V3z"/></svg>`;
      const pcIconSVG = `<svg viewBox="0 0 24 24"><path d="M21 2H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h7v2H8v2h8v-2h-2v-2h7c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H3V4h18v12z"/></svg>`;

      myGames.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
          <img class="grid-thumbnail" src="${game.thumbnail}" alt="${game.title}">
          <div class="card-info">
            <div class="card-title">${game.title}</div>
            <div class="card-date">Released: ${game.date}</div>
          </div>
        `;

        card.addEventListener('click', () => openModal(game));
        container.appendChild(card);
      });

      function openModal(game) {
        document.getElementById('modalThumb').src = game.thumbnail;
        document.getElementById('modalTitle').textContent = game.title;
        document.getElementById('modalMeta').textContent = `Released: ${game.date} | Version: ${game.version}`;
        document.getElementById('modalDesc').innerHTML = game.description;
        document.getElementById('modalPlay').href = game.link;

        const iconsContainer = document.getElementById('modalIcons');
        iconsContainer.innerHTML = '';
        if (game.mobile) iconsContainer.innerHTML += mobileIconSVG;
        if (game.pc) iconsContainer.innerHTML += pcIconSVG;

        backdrop.classList.add('active');
      }

      closeBtn.addEventListener('click', () => backdrop.classList.remove('active'));
      backdrop.addEventListener('click', (e) => {
        if (e.target === backdrop) backdrop.classList.remove('active');
      });

      // YouTube Channel Link Logic on Click
      const trapperWidget = document.getElementById('trapperWidget');
      const ytChannelUrl = 'https://youtube.com/@trapper_guy_channel?si=hz8I4zq7Vjji0IeN';
      
      trapperWidget.addEventListener('click', () => {
        window.open(ytChannelUrl, '_blank');
      });
    </script>
  </body>
</html>
